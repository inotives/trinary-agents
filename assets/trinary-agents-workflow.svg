<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">How Trinary Agents works</title>
  <desc id="desc">A human approves a plan, then the project manager dispatches one task at a time to a worker and an independent reviewer. The project manager records status and handoffs in Markdown. An optional generated dashboard helps monitor task status, dependencies, progress, and handoff activity.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#39D6B0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#8792B2"/>
    </marker>
    <marker id="arrow-warm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#E6AC62"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #F4F5FC; font-size: 27px; font-weight: 700; }
      .subtitle { fill: #AAB4D0; font-size: 14px; }
      .card-title { fill: #F4F5FC; font-size: 17px; font-weight: 650; }
      .body { fill: #B9C2DA; font-size: 13px; }
      .small { fill: #AAB4D0; font-size: 11px; }
      .tiny { fill: #919CB9; font-size: 10px; }
      .label { fill: #D6DDF0; font-size: 11px; font-weight: 600; letter-spacing: .4px; }
    </style>
  </defs>
  <rect width="1120" height="650" rx="24" fill="#111522"/>
  <rect x="1" y="1" width="1118" height="648" rx="23" fill="none" stroke="#293149"/>

  <text x="40" y="48" class="title">A clear plan. One task at a time. Durable handoffs.</text>
  <text x="40" y="74" class="subtitle">Trinary Agents coordinates the work; Markdown keeps the source of truth in the project.</text>

  <!-- Main workflow -->
  <rect x="40" y="108" width="150" height="125" rx="16" fill="#1A2031" stroke="#8B7CFF" stroke-width="1.5"/>
  <circle cx="67" cy="139" r="13" fill="#2B2850"/>
  <path d="M61 139h12M67 133v12" stroke="#B7AAFF" stroke-width="2" stroke-linecap="round"/>
  <text x="88" y="145" class="card-title">Human</text>
  <text x="58" y="178" class="body">Sets direction</text>
  <text x="58" y="198" class="body">Approves plan</text>
  <text x="58" y="218" class="body">Accepts result</text>

  <path d="M190 170h39" fill="none" stroke="#8792B2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="198" y="156" class="tiny">approved plan</text>

  <rect x="240" y="108" width="190" height="125" rx="16" fill="#1A2031" stroke="#A99BFF" stroke-width="1.5"/>
  <circle cx="268" cy="139" r="13" fill="#2B2850"/>
  <path d="M261 136h14M261 141h9" stroke="#B7AAFF" stroke-width="2" stroke-linecap="round"/>
  <text x="290" y="145" class="card-title">Project manager</text>
  <text x="258" y="178" class="body">Breaks plan into tasks</text>
  <text x="258" y="198" class="body">Owns status and dispatch</text>
  <text x="258" y="218" class="body">Tracks dependencies</text>

  <path d="M430 170h44" fill="none" stroke="#8792B2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="434" y="156" class="tiny">one ready task</text>

  <rect x="485" y="108" width="165" height="125" rx="16" fill="#1A2031" stroke="#48D8B5" stroke-width="1.5"/>
  <circle cx="513" cy="139" r="13" fill="#163D3A"/>
  <path d="m507 139 4 4 8-9" fill="none" stroke="#72E7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="535" y="145" class="card-title">Worker</text>
  <text x="503" y="178" class="body">Implements task</text>
  <text x="503" y="198" class="body">Writes handoff</text>
  <text x="503" y="218" class="body">Reports checks</text>

  <path d="M650 170h44" fill="none" stroke="#8792B2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="156" class="tiny">work + evidence</text>

  <rect x="705" y="108" width="165" height="125" rx="16" fill="#1A2031" stroke="#FFBF69" stroke-width="1.5"/>
  <circle cx="733" cy="139" r="13" fill="#44331F"/>
  <circle cx="733" cy="139" r="6" fill="none" stroke="#FFD08D" stroke-width="2"/>
  <path d="M737 143l5 5" stroke="#FFD08D" stroke-width="2" stroke-linecap="round"/>
  <text x="755" y="145" class="card-title">Reviewer</text>
  <text x="723" y="178" class="body">Checks independently</text>
  <text x="723" y="198" class="body">Approves or requests</text>
  <text x="723" y="218" class="body">changes</text>

  <path d="M870 170h40" fill="none" stroke="#E6AC62" stroke-width="2" marker-end="url(#arrow-warm)"/>
  <text x="875" y="156" class="tiny">approved</text>

  <rect x="920" y="108" width="160" height="125" rx="16" fill="#1A2031" stroke="#39D6B0" stroke-width="1.5"/>
  <circle cx="948" cy="139" r="13" fill="#163D3A"/>
  <path d="m942 139 4 4 8-9" fill="none" stroke="#72E7C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="970" y="145" class="card-title">Done</text>
  <text x="938" y="178" class="body">Manager updates status</text>
  <text x="938" y="198" class="body">Next task may unblock</text>
  <text x="938" y="218" class="body">Human accepts feature</text>

  <!-- Review loop -->
  <path d="M787 233v37H568v-31" fill="none" stroke="#E6AC62" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-warm)"/>
  <rect x="624" y="254" width="140" height="25" rx="12" fill="#2C261D"/>
  <text x="643" y="271" class="small" fill="#FFD08D">changes requested</text>

  <!-- Records and monitoring -->
  <path d="M335 233v65M568 233v65M787 233v65" fill="none" stroke="#58627E" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="40" y="310" width="1040" height="296" rx="18" fill="#171C2A" stroke="#303951"/>
  <text x="66" y="348" class="label">PROJECT RECORDS</text>
  <text x="66" y="372" class="subtitle">Keep the workflow inspectable in the repository</text>

  <rect x="66" y="395" width="260" height="157" rx="14" fill="#1E2536" stroke="#46516E"/>
  <path d="M88 420h18l8 8v24H88z" fill="none" stroke="#A99BFF" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M106 420v9h8M93 438h16M93 444h16" stroke="#A99BFF" stroke-width="1.4" stroke-linecap="round"/>
  <text x="126" y="438" class="card-title">Feature README</text>
  <text x="88" y="474" class="body">Approved scope and acceptance</text>
  <text x="88" y="494" class="body">criteria for the whole feature</text>
  <text x="88" y="527" class="small">Canonical plan</text>

  <rect x="344" y="395" width="310" height="157" rx="14" fill="#1E2536" stroke="#46516E"/>
  <path d="M366 420h18l8 8v24h-26z" fill="none" stroke="#48D8B5" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M384 420v9h8M371 438h16M371 444h16" stroke="#48D8B5" stroke-width="1.4" stroke-linecap="round"/>
  <text x="404" y="438" class="card-title">Task README + handoffs</text>
  <text x="366" y="474" class="body">Status, dependencies, acceptance,</text>
  <text x="366" y="494" class="body">worker and reviewer evidence</text>
  <text x="366" y="527" class="small">Task README is canonical; handoffs append evidence</text>

  <path d="M654 474h31" stroke="#8792B2" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="654" y="458" class="tiny">generate snapshot</text>

  <rect x="690" y="395" width="358" height="157" rx="14" fill="#202536" stroke="url(#accent)" stroke-width="1.5"/>
  <rect x="712" y="416" width="40" height="31" rx="5" fill="none" stroke="#B7AAFF" stroke-width="1.6"/>
  <path d="M712 425h40M722 421h1M728 421h1M734 421h1" stroke="#B7AAFF" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M719 434h7v7h-7zM731 434h7v7h-7z" fill="#48D8B5" opacity=".85"/>
  <text x="766" y="438" class="card-title">Optional task dashboard</text>
  <text x="712" y="474" class="body">See task lanes, dependencies, progress,</text>
  <text x="712" y="494" class="body">cycle time, and the handoff timeline</text>
  <text x="712" y="527" class="small">Read-only snapshot · task files remain source of truth</text>

  <text x="66" y="583" class="small">For multi-task features, generate the dashboard from task metadata and handoffs. Workflow works without it.</text>
</svg>
