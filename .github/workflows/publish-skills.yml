name: Publish skill releases

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version-bumps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require a version bump for changed skills
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/validate_skill_versions.py "$BASE_SHA" "$HEAD_SHA"

  test-skills:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run dashboard generator tests
        run: python3 -m unittest discover -s skills/trinary-agents/tests -v

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        skill:
          - trinary-agents
          - trinary-workspace-backup
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read skill version
        id: version
        env:
          SKILL: ${{ matrix.skill }}
        run: |
          version="$(tr -d '[:space:]' < "skills/$SKILL/VERSION")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid semantic version in skills/$SKILL/VERSION: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$SKILL-v$version" >> "$GITHUB_OUTPUT"
          echo "asset=$SKILL-v$version.zip" >> "$GITHUB_OUTPUT"

      - name: Skip an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already has a GitHub Release; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package skill folder
        if: steps.existing.outputs.published == 'false'
        env:
          SKILL: ${{ matrix.skill }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          mkdir -p "$RUNNER_TEMP/skill-releases"
          (cd skills && zip -qr "$RUNNER_TEMP/skill-releases/$ASSET" "$SKILL" \
            -x '*/.DS_Store' '*/__pycache__/*')

      - name: Extract changelog notes
        if: steps.existing.outputs.published == 'false'
        env:
          SKILL: ${{ matrix.skill }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          notes="$RUNNER_TEMP/skill-releases/$SKILL-notes.md"
          changelog="skills/$SKILL/CHANGELOG.md"
          : > "$notes"
          if [[ -f "$changelog" ]]; then
            awk -v heading="## $VERSION" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog" > "$notes"
          fi
          if [[ -s "$notes" ]]; then
            echo "Using $changelog section for $VERSION."
          else
            echo "No $VERSION section in $changelog; using generated notes only."
          fi

      - name: Create GitHub Release
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SKILL: ${{ matrix.skill }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/skill-releases/$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$SKILL v$VERSION" \
            --notes-file "$RUNNER_TEMP/skill-releases/$SKILL-notes.md" \
            --generate-notes \
            --target "$GITHUB_SHA"
